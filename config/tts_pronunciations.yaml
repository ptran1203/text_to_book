# Text substitutions applied ONLY to what's sent to piper for synthesis - the
# displayed/DTBook text keeps the original correct spelling. piper's vi_VN
# voice applies Vietnamese pronunciation rules to whatever it's given, so
# English names/terms come out wrong; these give it a Vietnamese-spelled
# approximation instead (the long-standing "phiên âm" convention Vietnamese
# media uses for foreign names).
#
# UNVERIFIED BY EAR - I can't listen to the output. These are a first-pass
# best effort covering the most frequent recurring terms across the book
# (intro + chapters 1-6). Listen and tell me what still sounds wrong so I can
# correct entries here - this file is meant to grow through that feedback.
#
# Longest phrase wins when phrases overlap; matching is case-sensitive on the
# original text.

replacements:
  # --- the book's own central term, appears constantly ---
  "poker": "pô kơ"
  "Poker": "Pô kơ"

  # --- acronyms: spoken as Vietnamese letter names ---
  "CEO": "xi i âu"
  "NBC": "en bi xi"
  "MTV": "em ti vi"
  "BBS": "bi bi ét sì"
  "CIA": "xi ai ê"

  # --- places ---
  "New Hampshire": "Niu Hem sơ"
  "Pennsylvania": "Pen sồn vây nia"
  "Montana": "Môn ta na"
  "Las Vegas": "Lát Vê gát"
  "Vegas": "Vê gát"
  "New Jersey": "Niu Giơ si"
  "Des Moines": "Đơ Moin"
  "Princeton": "Prin xtơn"
  "Dartmouth": "Đác mợt"
  "Stanford": "Xtan phợt"
  "Harvard": "Ha vợt"

