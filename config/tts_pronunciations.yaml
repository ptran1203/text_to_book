  # --- redundant English names dropped where a Vietnamese gloss is already
  # spoken right next to them in the sentence (no need to also say the English) ---
  "(National Science Foundation - NSF)": "(en ét ép)"
  "(National Science Foundation – NSF)": "(en ét ép)"

