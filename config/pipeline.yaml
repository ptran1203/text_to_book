# Knobs for the DAISY pipeline. Paths may be bare exe names (resolved on PATH)
# or absolute paths. Windows examples shown.

source_pdf: data/book.pdf

requirements:
  min_seconds_per_member: 3600   # 1 hour of narrated speech per member (course requirement)

step_00_extract:
  # When a page is a single full-page scan, extract that image losslessly.
  # Otherwise rasterise the page vector content at this DPI.
  render_dpi: 300
  prefer_native_images: true
  image_format: png            # png | tiff  (for rendered pages)

step_01_ocr:
  # Tesseract is used ONLY for line detection (bounding boxes / glyph heights).
  # Actual character recognition is done by VietOCR below - much more accurate
  # on Vietnamese diacritics (~0.90+ line confidence on real scanned pages,
  # vs Tesseract's own 'vie' recognizer being noticeably worse).
  tesseract: "C:/Program Files/Tesseract-OCR/tesseract.exe"
  tessdata_dir: "C:/tools/tessdata"   # avoids needing admin rights on Program Files\...\tessdata
  lang: vie
  oem: 1                       # 1 = LSTM
  psm: 6                       # 6 = assume a single uniform block of text
  preprocess:
    grayscale: true
    autocontrast: true
    otsu_threshold: false      # binarising hurt VietOCR in testing - it wants natural grayscale
    deskew: true                # small-angle deskew; needs numpy
  vietocr:
    config_name: vgg_transformer   # see vietocr.tool.config.Cfg.url_config for alternatives
    device: cuda:0                  # "cpu" if no GPU; this machine has CUDA
    weights: ""                     # override path; blank = auto-download pretrained weights
  line_padding_ratio: 0.25     # vertical padding added to each line crop (fraction of its height)
  min_line_confidence: 0.80    # VietOCR prob (0-1) below this -> lowconf.csv

step_02_clean:
  dehyphenate_linebreaks: true
  join_wrapped_lines: true
  strip_running_headers: true
  running_header_min_ratio: 0.30   # a top/bottom line seen on >=30% of pages is furniture
  drop_pagenumber_lines: true
  hunspell:
    enabled: false
    dict_dir: ""              # dir containing vi_VN.dic / vi_VN.aff
  # ordered list of [pattern, replacement] regexes applied to every page
  replacements:
    - ['[ \t]+([,.;:!?])', '\1']       # no space before punctuation
    # ensure space after punctuation, EXCEPT inside a number (Vietnamese uses
    # comma as the decimal separator and period as the thousands separator -
    # "6,4 triệu" is 6.4 million; without these guards it became "6, 4",
    # which piper then read as two numbers with a pause between them)
    - ['(?<!\d)([,.;:!?])(?=[^\s\d])', '\1 ']
    - ['\u00a0', ' ']                  # nbsp -> space

step_03_structure:
  # printed_page_number = image_index (1-based) + page_offset
  page_offset: 0
  # heading heuristic (used by --detect to seed config/structure.yaml)
  heading_height_ratio: 1.35   # line height >= ratio * page median -> heading candidate
  heading_regex: '^(PH\u1EA6N|Ph\u1EA7n|CH\u01AF\u01A0NG|Ch\u01B0\u01A1ng|Chapter|PART)\b'
  sentence_split: true

step_04_tts:
  piper: "C:/tools/piper/piper.exe"
  model: "C:/tools/piper/vi_VN-vais1000-medium.onnx"
  ffmpeg: "C:/Users/hai/AppData/Local/Microsoft/WinGet/Packages/Gyan.FFmpeg_Microsoft.Winget.Source_8wekyb3d8bbwe/ffmpeg-9.0.1-full_build/bin/ffmpeg.exe"
  mp3_qscale: 4                        # libmp3lame VBR quality (0 best .. 9)
  sample_rate: 22050
  length_scale: 1.0                    # >1 slower speech

step_05_smil: {}

step_06_package:
  # one DAISY 3 book per chapter (README: large books split; ISBN shared)
  split: per_chapter                   # per_chapter | single
  audio_dir_name: audio

step_07_validate:
  dp2: "dp2"                           # DAISY Pipeline 2 CLI
  run_validator: true
  run_mastering: false                 # daisy3-to-daisy3 normalisation pass
  fail_on_validator_error: true

step_08_submit:
  # Output tree:  <mshv_folder>/<book_slug>-Ch\u01B0\u01A1ng N/{<book_slug>.zip, <book_slug>_sha256sums.txt}
  zip_basename: ""                    # blank = use metadata.yaml's book_slug (the actual book name)
  sha256_of_members: true            # hash each file inside the zip (sha256sums.txt format)
